<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>It always looks like there's more at the bottom.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page scene">
    <h1>It always looks like there's more at the bottom.</h1>

    <svg id="water-stains" class="water-stains" viewBox="0 0 1462 1076" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <!-- Follow the inner basin, leaving the ceramic counter dry. -->
      <path d="M310 315 Q277 316 249 344 Q170 438 147 647 Q132 731 174 758 Q218 780 324 780 L970 777 Q1080 776 1118 741 Q1158 710 1142 635 Q1119 440 1048 340 Q1027 312 990 312 Z" fill="#379ed3"/>
    </svg>

    <button id="drain-button" class="drain-button" type="button" aria-label="Drain all water">
      <svg viewBox="594 437 98 94" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <image href="assests/bathroom-background.png" width="1462" height="1076"/>
      </svg>
    </button>

    <div class="objects">
      <section class="toothpaste-display">
        <button id="toothpaste-button" class="image-button" type="button" aria-label="Use toothpaste — 100% remaining">
        <img id="toothpaste-image" src="assests/Images/paste1.png" width="1672" height="941" draggable="false" alt="Toothpaste tube, 100% remaining">
        </button>
      </section>

      <section class="tissue-display">
        <button id="tissue-button" class="image-button tissue-button" type="button" aria-label="Use tissue — 100% remaining">
          <img id="tissue-image" src="assests/Images/tissue/tissue1.png" width="1536" height="1024" draggable="false" alt="Tissue box, 100% remaining">
        </button>
      </section>
    </div>
  </main>

  <script>
    const image = document.querySelector('#toothpaste-image');
    const button = document.querySelector('#toothpaste-button');
    const tissueImage = document.querySelector('#tissue-image');
    const tissueButton = document.querySelector('#tissue-button');
    const imagePaths = [
      'assests/Images/paste1.png',
      'assests/Images/paste11.png',
      'assests/Images/paste2.png',
      'assests/Images/paste12.png',
      'assests/Images/paste3.png',
      'assests/Images/paste13.png',
      'assests/Images/paste4.png',
      'assests/Images/paste14.png',
      'assests/Images/paste5.png',
      'assests/Images/paste15.png',
      'assests/Images/paste6.png',
      'assests/Images/paste16.png',
      'assests/Images/paste7.png',
      'assests/Images/paste8.png',
      'assests/Images/paste9.png',
      'assests/Images/paste10.png'
    ];
    const totalStates = imagePaths.length;
    const tissuePaths = Array.from({ length: 3 }, (_, index) => `assests/Images/tissue/tissue${index + 1}.png`);
    const audioFiles = [
      'assests/audio/squirt_1.mp3',
      'assests/audio/squirt_2.mp3',
      'assests/audio/squirt_3.mp3'
    ];
    let state = 0;
    let tissueState = 0;
    let tissueClicks = 0;
    let waterLevel = 0;
    let dryingBoost = 0;
    const maxWaterOpacity = 0.34;
    const waterStains = document.querySelector('#water-stains');
    function renderWater() {
      waterStains.style.opacity = waterLevel * maxWaterOpacity;
    }
    const tissueSound = new Audio('assests/audio/tissue-pull.wav');
    tissueSound.preload = 'auto';
    tissueSound.volume = 0.8;

    function addWater(amount) {
      waterStains.classList.remove('is-cleared');
      waterLevel = Math.min(1, waterLevel + amount);
      renderWater();
    }

    document.querySelector('#drain-button').addEventListener('click', () => {
      waterLevel = 0;
      dryingBoost = 0;
      waterStains.classList.add('is-cleared');
      renderWater();
    });

    function wipeWater() {
      waterLevel = Math.max(0, waterLevel - 0.1);
      dryingBoost = waterLevel > 0 ? Math.min(0.16, dryingBoost + 0.04) : 0;
      renderWater();
    }

    let tissueFeedback;
    function showTissueFeedback() {
      if (tissueFeedback) tissueFeedback.cancel();
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      tissueFeedback = tissueImage.animate(
        reducedMotion
          ? [{ opacity: 1 }, { opacity: 0.65 }, { opacity: 1 }]
          : [
              { transform: 'translateX(0) rotate(0deg)' },
              { transform: 'translateX(-3px) rotate(-2deg)' },
              { transform: 'translateX(3px) rotate(2deg)' },
              { transform: 'translateX(-2px) rotate(-1deg)' },
              { transform: 'translateX(0) rotate(0deg)' }
            ],
        { duration: 280, easing: 'ease-out' }
      );
    }

    let lastDryTime = performance.now();
    setInterval(() => {
      const now = performance.now();
      const seconds = (now - lastDryTime) / 1000;
      lastDryTime = now;
      // Water always drains naturally, including after reaching the cap.
      waterLevel = Math.max(0, waterLevel - (0.025 + dryingBoost) * seconds);
      dryingBoost = waterLevel > 0 ? Math.max(0, dryingBoost - 0.012 * seconds) : 0;
      renderWater();
    }, 100);

    button.addEventListener('click', () => {
      const randomAudio = audioFiles[Math.floor(Math.random() * audioFiles.length)];
      const sound = new Audio(randomAudio);
      sound.play().catch(() => {});
      addWater(0.12);

      if (state >= totalStates - 1) {
        state = 0;
        image.src = imagePaths[0];
        image.alt = 'Toothpaste tube, 100% remaining';
        button.setAttribute('aria-label', 'Use toothpaste — 100% remaining');
        return;
      }

      state += 1;
      const remaining = Math.round(100 - state * (100 / (totalStates - 1)));
      const remainingText = `${remaining}% remaining`;

      image.src = imagePaths[state];
      image.alt = `Toothpaste tube, ${remainingText}`;
      button.setAttribute('aria-label', state === totalStates - 1 ? 'Toothpaste is empty' : `Use toothpaste — ${remainingText}`);
    });

    tissueButton.addEventListener('click', () => {
      tissueSound.currentTime = 0;
      tissueSound.play().catch(() => {});
      wipeWater();
      showTissueFeedback();

      if (tissueState === 0) {
        tissueClicks += 1;
        if (tissueClicks < 13) return;
        tissueState = 1;
        tissueImage.src = tissuePaths[tissueState];
        tissueImage.alt = 'Tissue box, one tissue remaining';
        tissueButton.setAttribute('aria-label', 'Use the last tissue');
        return;
      }

      if (tissueState === 1) {
        tissueState = 2;
        tissueImage.src = tissuePaths[tissueState];
        tissueImage.alt = 'Empty tissue box';
        tissueButton.setAttribute('aria-label', 'Empty tissue box');
        return;
      }

      if (tissueState >= tissuePaths.length - 1) {
        tissueState = 0;
        tissueClicks = 0;
        tissueImage.src = tissuePaths[0];
        tissueImage.alt = 'Tissue box, 100% remaining';
        tissueButton.setAttribute('aria-label', 'Use tissue — 100% remaining');
        return;
      }
    });
  </script>
</body>
</html>
