<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>It always looks like there's more at the bottom.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>It always looks like there's more at the bottom.</h1>

    <section class="toothpaste-display">
      <button id="toothpaste-button" class="image-button" type="button" aria-label="Use toothpaste — 100% remaining">
        <img id="toothpaste-image" src="assests/Images/paste1.png" alt="Toothpaste tube, 100% remaining">
      </button>
    </section>
  </main>

  <script>
    const image = document.querySelector('#toothpaste-image');
    const button = document.querySelector('#toothpaste-button');
    const totalStates = 10;
    let state = 0;
    let backgroundBrightness = 100;
    let backgroundDirection = -1;

    button.addEventListener('click', () => {
      backgroundBrightness += backgroundDirection * 10;

      if (backgroundBrightness <= 0) {
        backgroundBrightness = 0;
        backgroundDirection = 1;
      } else if (backgroundBrightness >= 100) {
        backgroundBrightness = 100;
        backgroundDirection = -1;
      }

      document.body.style.backgroundColor = `rgb(${backgroundBrightness}%, ${backgroundBrightness}%, ${backgroundBrightness}%)`;

      if (state >= totalStates - 1) {
        state = 0;
        image.src = 'assests/Images/paste1.png';
        image.alt = 'Toothpaste tube, 100% remaining';
        button.setAttribute('aria-label', 'Use toothpaste — 100% remaining');
        return;
      }

      state += 1;
      const remaining = 100 - state * 10;
      const assetNumber = state + 1;
      const remainingText = `${remaining}% remaining`;

      image.src = `assests/Images/paste${assetNumber}.png`;
      image.alt = `Toothpaste tube, ${remainingText}`;
      button.setAttribute('aria-label', state === totalStates - 1 ? 'Toothpaste is empty' : `Use toothpaste — ${remainingText}`);
    });
  </script>
</body>
</html>
